<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto | Muralia</title>
<meta name="robots" content="noindex, follow">
<script>
  (function () {
    var slug = new URLSearchParams(window.location.search).get('slug');
    window.location.replace(slug && /^[a-z0-9-]+$/.test(slug) ? '/productos/' + slug + '.html' : '/productos.html');
  })();
</script>
</head>
<body>
<p>Esta página se movió. <a href="/productos.html">Ver el catálogo de productos</a>.</p>
</body>
</html>
